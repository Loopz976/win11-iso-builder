name: W10 IOT LTSC 1288 EN-US  Features 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract script
        run: tar -xf w10-iotltsc-1288-en-us-features-part1.zip

      - name: Find correct CMD
        shell: powershell
        run: |
          $file = Get-ChildItem -Recurse -Filter *.cmd | Where-Object { $_.Name -notlike "*W10UI*" } | Select-Object -First 1
          Copy-Item $file.FullName script_fixed.cmd

      - name: Run script
        shell: cmd
        continue-on-error: true
        run: |
          echo F|call script_fixed.cmd

      - name: Create output
        run: mkdir output

      - name: Process Features ISO
        shell: cmd
        run: |
          for %%f in (*.iso) do (
            echo %%f | findstr /i "7669fc91" >nul
            if not errorlevel 1 (
              move "%%f" output\
              cd output
              7z a -v1900m -mx=0 "w10-features-2004-part1.7z" "%%f"
              del "%%f"
              cd ..
            )
          )

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: w10-features-2004-part1
          name: W10 Features On Demand 2004 Part1
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
