name: Build Windows ISO v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install 7zip
      run: choco install 7zip -y

    # =========================
    # BAIXAR ISO (3 PARTES)
    # =========================
    - name: Download ISO Parts
      run: |
        mkdir ISO
        cd ISO
        curl -L -o part1.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
        curl -L -o part1.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
        curl -L -o part1.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      shell: cmd
      run: |
        cd ISO
        7z x part1.7z.001 -oISO_EXTRACTED -y

    # =========================
    # BAIXAR NTLITE PROJETO
    # =========================
    - name: Download ProjetoNTLite
      run: |
        curl -L -o ProjetoNTLite.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip

    - name: Extract ProjetoNTLite
      run: |
        7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # BAIXAR PRESET
    # =========================
    - name: Download Preset
      run: |
        curl -L -o Preset.zip https://github.com/Loopz976/ltsc-auto-builder/raw/main/Preset.zip

    - name: Extract Preset
      run: |
        mkdir ProjetoNTLite\Preset
        7z x Preset.zip -oProjetoNTLite\Preset -y

    - name: Check Preset (DEBUG)
      run: |
        dir ProjetoNTLite\Preset

    # =========================
    # RODAR NTLITE COM LOG AO VIVO
    # =========================
    - name: Run NTLite (Live Log)
      shell: powershell
      run: |
        $log = "ntlite.log"

        Write-Host "Iniciando NTLite..."

        $process = Start-Process "ProjetoNTLite\NTLite\NTLite.exe" `
          -ArgumentList "/silent /load:Preset\W10_19044_FINAL_NVIDIA_21_04_26.xml /apply /exit /log:$log" `
          -PassThru

        while (-not $process.HasExited) {
            if (Test-Path $log) {
                Get-Content $log -Tail 5
            } else {
                Write-Host "Aguardando log..."
            }
            Start-Sleep -Seconds 10
        }

        Write-Host "NTLite finalizado"

        if (Test-Path $log) {
            Write-Host "==== LOG FINAL ===="
            Get-Content $log -Tail 50
        }

    # =========================
    # CRIAR ISO
    # =========================
    - name: Create ISO
      run: |
        mkdir FINAL
        oscdimg -bISO\ISO_EXTRACTED\boot\etfsboot.com -u2 -h -m -o -lWIN10_CUSTOM ISO\ISO_EXTRACTED FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # SPLIT ISO
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10LTSC_CUSTOM.7z FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Win10 LTSC Custom Build
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
