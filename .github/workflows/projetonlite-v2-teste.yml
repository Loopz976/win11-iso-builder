name: Build Windows ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install 7zip
      run: choco install 7zip -y

    # =========================
    # BAIXAR ISO (3 PARTES)
    # =========================
    - name: Download ISO Parts
      shell: powershell
      run: |
        mkdir ISO
        cd ISO
        curl -L -o part1.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
        curl -L -o part1.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
        curl -L -o part1.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      shell: cmd
      run: |
        cd ISO
        7z x part1.7z.001 -oISO_EXTRACTED -y

    # =========================
    # BAIXAR PROJETO NTLITE
    # =========================
    - name: Download ProjetoNTLite
      shell: powershell
      run: |
        curl -L -o ProjetoNTLite.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip

    - name: Extract ProjetoNTLite
      run: 7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # DETECTAR + CORRIGIR XML
    # =========================
    - name: Detect and Fix XML
      shell: powershell
      run: |
        $xml = Get-ChildItem -Recurse -Filter *.xml | Select-Object -First 1

        if (-not $xml) {
          Write-Error "Nenhum XML encontrado!"
          exit 1
        }

        Write-Host "XML encontrado:" $xml.FullName

        # Corrige caminhos quebrados
        (Get-Content $xml.FullName) `
          -replace 'C:\\ProjetoNTlite\\', '' `
          -replace 'D:\\.*?\.iso', 'output.iso' |
          Set-Content $xml.FullName

        echo "XML corrigido"

        # Salva caminho para próximos steps
        echo "XML_PATH=$($xml.FullName)" >> $env:GITHUB_ENV

    # =========================
    # RODAR NTLITE (FIX REAL)
    # =========================
    - name: Run NTLite (Silent + Log)
      shell: powershell
      run: |
        $exe = "ProjetoNTLite\NTLite\NTLite.exe"

        if (-not (Test-Path $exe)) {
          Write-Error "NTLite não encontrado!"
          exit 1
        }

        Write-Host "Rodando com preset:" $env:XML_PATH

        Start-Process $exe `
          -ArgumentList "/silent /load:`"$env:XML_PATH`" /apply /exit /log:ntlite.log" `
          -Wait

        echo "==== LOG NTLITE ===="
        if (Test-Path "ntlite.log") {
          Get-Content ntlite.log -Tail 200
        } else {
          echo "Log não encontrado"
        }

    # =========================
    # CRIAR ISO
    # =========================
    - name: Create ISO
      shell: cmd
      run: |
        mkdir FINAL
        oscdimg -bISO\ISO_EXTRACTED\boot\etfsboot.com -u2 -h -m -o -lWIN10_CUSTOM ISO\ISO_EXTRACTED FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # SPLIT ISO
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10LTSC_CUSTOM.7z FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Win10 LTSC Custom Build
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
