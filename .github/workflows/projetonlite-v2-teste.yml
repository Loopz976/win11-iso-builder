name: Build ISO NTLite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 🔽 Extrair seu projeto base (se tiver zipado)
    - name: Extract ProjetoNTLite
      run: |
        if (Test-Path "ProjetoNTLite.zip") {
          7z x ProjetoNTLite.zip -oProjetoNTLite -y
        }

    # 🔽 Extrair preset
    - name: Extract Preset
      run: |
        if (Test-Path "Preset.zip") {
          7z x Preset.zip -oProjetoNTLite -y
        } else {
          Write-Error "Preset.zip não encontrado"
          exit 1
        }

    # 🔍 DEBUG (ver estrutura real)
    - name: List Files (DEBUG)
      run: |
        Get-ChildItem -Recurse

    # 🔥 DETECTAR XML AUTOMATICAMENTE
    - name: Detect XML Preset
      id: detect_xml
      shell: powershell
      run: |
        $xml = Get-ChildItem -Recurse -Filter *.xml | Select-Object -First 1

        if (-not $xml) {
          Write-Error "Nenhum XML encontrado"
          exit 1
        }

        echo "XML_PATH=$($xml.FullName)" >> $env:GITHUB_ENV
        Write-Host "XML encontrado:"
        Write-Host $xml.FullName

    # 🔧 CORRIGIR CAMINHOS DO XML
    - name: Fix XML Paths
      shell: powershell
      run: |
        $xmlPath = "$env:XML_PATH"

        Write-Host "Corrigindo XML em:"
        Write-Host $xmlPath

        $content = Get-Content $xmlPath -Raw

        # Remove caminhos inválidos do seu PC
        $content = $content -replace "C:\\ProjetoNTlite\\", ""
        $content = $content -replace "D:\\NTLite.iso", "NTLite.iso"

        Set-Content $xmlPath $content -Encoding UTF8

    # 🔽 Baixar NTLite
    - name: Download NTLite
      run: |
        Invoke-WebRequest -Uri "https://www.ntlite.com/files/NTLite_setup_x64.exe" -OutFile ntlite.exe

    - name: Install NTLite
      run: |
        Start-Process .\ntlite.exe -ArgumentList "/S" -Wait

    # 🔥 RODAR NTLITE
    - name: Run NTLite
      shell: powershell
      run: |
        $ntlite = "C:\Program Files\NTLite\NTLite.exe"
        $xml = "$env:XML_PATH"

        if (!(Test-Path $ntlite)) {
          Write-Error "NTLite não encontrado"
          exit 1
        }

        Write-Host "Executando NTLite..."
        Start-Process $ntlite -ArgumentList "/silent","/preset:$xml" -Wait

    # 📦 PEGAR ISO
    - name: Collect ISO
      run: |
        mkdir output
        Get-ChildItem -Recurse -Filter *.iso | Copy-Item -Destination output -ErrorAction SilentlyContinue

    # 🚀 UPLOAD
    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: ISO_FINAL
        path: output
