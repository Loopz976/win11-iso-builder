name: Build Windows ISO v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install 7zip
      run: choco install 7zip -y

    # =========================
    # BAIXAR ISO (3 PARTES)
    # =========================
    - name: Download ISO Parts
      run: |
        mkdir ISO
        cd ISO
        curl -L -o part1.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
        curl -L -o part1.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
        curl -L -o part1.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      shell: cmd
      run: |
        cd ISO
        7z x part1.7z.001 -oISO_EXTRACTED -y

    # =========================
    # BAIXAR PROJETO NTLITE
    # =========================
    - name: Download ProjetoNTLite
      run: |
        curl -L -o ProjetoNTLite.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip

    - name: Extract ProjetoNTLite
      run: |
        7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # DETECTAR XML AUTOMATICO
    # =========================
    - name: Detect XML
      shell: powershell
      run: |
        $xml = Get-ChildItem -Recurse -Filter *.xml | Select-Object -First 1

        if (-not $xml) {
          Write-Error "XML não encontrado"
          exit 1
        }

        echo "XML_PATH=$($xml.FullName)" >> $env:GITHUB_ENV
        Write-Host "XML encontrado:"
        Write-Host $xml.FullName

    # =========================
    # CORRIGIR CAMINHOS XML
    # =========================
    - name: Fix XML Paths
      shell: powershell
      run: |
        $xml = "$env:XML_PATH"
        $content = Get-Content $xml -Raw

        $content = $content -replace "C:\\ProjetoNTlite\\", ""
        $content = $content -replace "D:\\NTLite.iso", "NTLite.iso"

        Set-Content $xml $content -Encoding UTF8

        Write-Host "XML corrigido"

    # =========================
    # RODAR NTLITE + LOG AO VIVO
    # =========================
    - name: Run NTLite (LIVE LOG)
      shell: powershell
      run: |
        $exe = "ProjetoNTLite\NTLite\NTLite.exe"
        $xml = "$env:XML_PATH"
        $log = "ntlite.log"

        if (!(Test-Path $exe)) {
          Write-Error "NTLite não encontrado"
          exit 1
        }

        Write-Host "Iniciando NTLite..."

        $proc = Start-Process $exe `
          -ArgumentList "/silent","/preset:$xml","/apply","/exit","/log:$log" `
          -PassThru

        # 🔥 ESPERA LOG CRIAR
        while (!(Test-Path $log)) {
          Write-Host "Aguardando NTLite iniciar..."
          Start-Sleep -Seconds 2
        }

        Write-Host "===== NTLITE LOG AO VIVO ====="

        $lastSize = 0

        # 🔥 STREAM REAL
        while (!$proc.HasExited) {

          $content = Get-Content $log -Raw

          if ($content.Length -gt $lastSize) {
            $new = $content.Substring($lastSize)
            Write-Output $new
            $lastSize = $content.Length
          }

          Start-Sleep -Seconds 3
        }

        Write-Host "===== FINAL ====="
        Get-Content $log -Tail 50

        if ($proc.ExitCode -ne 0) {
          Write-Error "NTLite falhou"
          exit 1
        }

    # =========================
    # CRIAR ISO FINAL
    # =========================
    - name: Create ISO
      shell: cmd
      run: |
        mkdir FINAL

        oscdimg ^
        -bootdata:2#p0,e,bISO\ISO_EXTRACTED\boot\etfsboot.com#pEF,e,bISO\ISO_EXTRACTED\efi\microsoft\boot\efisys.bin ^
        -u2 -h -m -o ^
        -lWIN10_CUSTOM ^
        ISO\ISO_EXTRACTED FINAL\Win10LTSC_21.04.2026_ntlite_actions.iso

    # =========================
    # SPLIT ISO
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10LTSC_21.04.2026_ntlite_actions.7z FINAL\Win10LTSC_21.04.2026_ntlite_actions.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Win10LTSC 21.04.2026 ntlite actions
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
