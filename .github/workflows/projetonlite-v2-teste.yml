name: Build Windows ISO v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install 7zip
      run: choco install 7zip -y

    # =========================
    # BAIXAR ISO (3 PARTES)
    # =========================
    - name: Download ISO Parts
      run: |
        mkdir ISO
        cd ISO
        curl -L -o part1.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
        curl -L -o part1.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
        curl -L -o part1.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      shell: cmd
      run: |
        cd ISO
        7z x part1.7z.001 -oISO_EXTRACTED -y

    # =========================
    # BAIXAR PROJETO NTLITE
    # =========================
    - name: Download ProjetoNTLite
      run: |
        curl -L -o ProjetoNTLite.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip

    - name: Extract ProjetoNTLite
      run: |
        7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # CORRIGIR XML DUPLO
    # =========================
    - name: Fix XML Name
      shell: cmd
      run: |
        cd ProjetoNTLite\Preset
        for %%f in (*.xml.xml) do ren "%%f" "*.xml"

    # =========================
    # DETECTAR XML AUTOMATICO
    # =========================
    - name: Detect XML Preset
      id: preset
      shell: powershell
      run: |
        $xml = Get-ChildItem "ProjetoNTLite\Preset" -Filter *.xml -Recurse | Select-Object -First 1
        if (!$xml) {
          Write-Error "Nenhum XML encontrado"
          exit 1
        }
        echo "XML=$($xml.FullName)" >> $env:GITHUB_ENV
        Write-Host "Preset encontrado: $($xml.FullName)"

    # =========================
    # RODAR NTLITE + LOG AO VIVO
    # =========================
    - name: Run NTLite (LIVE REAL)
      shell: powershell
      run: |
        $log = "ntlite.log"

        Write-Host "Iniciando NTLite..."

        $proc = Start-Process "ProjetoNTLite\NTLite\NTLite.exe" `
          -ArgumentList "/silent /load:$env:XML /apply /exit /log:$log" `
          -PassThru

        # espera log nascer
        while (!(Test-Path $log)) {
          Write-Host "Aguardando log iniciar..."
          Start-Sleep -Seconds 2
        }

        Write-Host "Log iniciado! Streaming..."

        $lastSize = 0

        while (!$proc.HasExited) {
          if (Test-Path $log) {
            $content = Get-Content $log -Raw
            if ($content.Length -gt $lastSize) {
              Write-Output ($content.Substring($lastSize))
              $lastSize = $content.Length
            }
          }
          Start-Sleep -Seconds 3
        }

        Write-Host "NTLite finalizado."

        Get-Content $log -Tail 50

    # =========================
    # CRIAR ISO
    # =========================
    - name: Create ISO
      run: |
        mkdir FINAL
        oscdimg -bISO\ISO_EXTRACTED\boot\etfsboot.com -u2 -h -m -o -lWIN10_CUSTOM ISO\ISO_EXTRACTED FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # SPLIT ISO
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10LTSC_CUSTOM.7z FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Win10 LTSC Custom Build
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
