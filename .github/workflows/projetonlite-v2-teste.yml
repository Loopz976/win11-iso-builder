name: Build Windows ISO v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        choco install 7zip -y
        choco install aria2 -y

    # =========================
    # DOWNLOAD ISO (ARIA2 TURBO)
    # =========================
    - name: Download ISO Parts (ARIA2)
      shell: cmd
      run: |
        mkdir ISO
        cd ISO

        aria2c -x 16 -s 16 -k 1M --retry-wait=5 --max-tries=10 ^
        -o part1.7z.001 ^
        https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001

        aria2c -x 16 -s 16 -k 1M --retry-wait=5 --max-tries=10 ^
        -o part1.7z.002 ^
        https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002

        aria2c -x 16 -s 16 -k 1M --retry-wait=5 --max-tries=10 ^
        -o part1.7z.003 ^
        https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      shell: cmd
      run: |
        cd ISO
        7z x part1.7z.001 -oISO_EXTRACTED -y

    # =========================
    # DOWNLOAD PROJETO NTLITE
    # =========================
    - name: Download ProjetoNTLite
      shell: cmd
      run: |
        aria2c -x 8 -s 8 -o ProjetoNTLite.zip ^
        https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip

    - name: Extract ProjetoNTLite
      run: 7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # DETECTAR + CORRIGIR XML
    # =========================
    - name: Fix XML
      shell: powershell
      run: |
        $xml = Get-ChildItem -Recurse -Filter *.xml | Select-Object -First 1
        if (!$xml) { throw "XML não encontrado" }

        (Get-Content $xml.FullName) `
          -replace 'C:\\ProjetoNTlite\\', '' `
          -replace 'D:\\.*?\.iso', 'output.iso' |
          Set-Content $xml.FullName

        echo "XML_PATH=$($xml.FullName)" >> $env:GITHUB_ENV

    # =========================
    # RODAR NTLITE
    # =========================
    - name: Run NTLite
      shell: powershell
      run: |
        $exe = "ProjetoNTLite\NTLite\NTLite.exe"
        if (!(Test-Path $exe)) { throw "NTLite não encontrado" }

        Start-Process $exe `
          -ArgumentList "/silent /load:`"$env:XML_PATH`" /apply /exit /log:ntlite.log" `
          -Wait

        if (Test-Path "ntlite.log") {
          Get-Content ntlite.log -Tail 200
        } else {
          throw "NTLite falhou"
        }

    # =========================
    # CRIAR ISO
    # =========================
    - name: Create ISO
      shell: cmd
      run: |
        mkdir FINAL
        oscdimg -bISO\ISO_EXTRACTED\boot\etfsboot.com -u2 -h -m -o -lWIN10_CUSTOM ISO\ISO_EXTRACTED FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # SPLIT ISO
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10LTSC_CUSTOM.7z FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Win10 LTSC Custom
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
