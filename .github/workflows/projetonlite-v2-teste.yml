name: Build Windows ISO v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install 7zip
      run: choco install 7zip -y

    # =========================
    # DOWNLOAD ISO (ROBUSTO)
    # =========================
    - name: Download ISO Parts (Stable)
      shell: powershell
      run: |
        mkdir ISO
        cd ISO

        function Download($url, $out) {
          $retry = 3
          for ($i=1; $i -le $retry; $i++) {
            try {
              Write-Host "Baixando $out tentativa $i..."
              Invoke-WebRequest $url -OutFile $out
              if ((Get-Item $out).Length -gt 100MB) { return }
            } catch {}
            Start-Sleep 5
          }
          throw "Falha download $out"
        }

        Download "https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001" "part1.7z.001"
        Download "https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002" "part1.7z.002"
        Download "https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003" "part1.7z.003"

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      shell: cmd
      run: |
        cd ISO
        7z x part1.7z.001 -oISO_EXTRACTED -y

    # =========================
    # DOWNLOAD PROJETO NTLITE
    # =========================
    - name: Download ProjetoNTLite
      shell: powershell
      run: |
        Invoke-WebRequest "https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip" -OutFile ProjetoNTLite.zip

    - name: Extract ProjetoNTLite
      run: 7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # DETECTAR E CORRIGIR XML
    # =========================
    - name: Detect & Fix XML
      shell: powershell
      run: |
        $xml = Get-ChildItem -Recurse -Filter *.xml | Select-Object -First 1

        if (!$xml) { throw "XML não encontrado" }

        Write-Host "Preset:" $xml.FullName

        (Get-Content $xml.FullName) `
          -replace 'C:\\ProjetoNTlite\\', '' `
          -replace 'D:\\.*?\.iso', 'output.iso' |
          Set-Content $xml.FullName

        echo "XML_PATH=$($xml.FullName)" >> $env:GITHUB_ENV

    # =========================
    # RODAR NTLITE
    # =========================
    - name: Run NTLite
      shell: powershell
      run: |
        $exe = "ProjetoNTLite\NTLite\NTLite.exe"

        if (!(Test-Path $exe)) { throw "NTLite não encontrado" }

        Write-Host "Rodando preset..."

        Start-Process $exe `
          -ArgumentList "/silent /load:`"$env:XML_PATH`" /apply /exit /log:ntlite.log" `
          -Wait

        if (Test-Path "ntlite.log") {
          Write-Host "==== LOG ===="
          Get-Content ntlite.log -Tail 200
        } else {
          throw "NTLite falhou (sem log)"
        }

    # =========================
    # CRIAR ISO
    # =========================
    - name: Create ISO
      shell: cmd
      run: |
        mkdir FINAL
        oscdimg -bISO\ISO_EXTRACTED\boot\etfsboot.com -u2 -h -m -o -lWIN10_CUSTOM ISO\ISO_EXTRACTED FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # SPLIT ISO
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10LTSC_CUSTOM.7z FINAL\Win10LTSC_CUSTOM.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Win10 LTSC Custom
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
