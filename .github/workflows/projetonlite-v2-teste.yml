name: Build Windows ISO v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install 7zip
      run: choco install 7zip -y

    # =========================
    # BAIXAR ISO BASE
    # =========================
    - name: Download ISO Parts
      shell: powershell
      run: |
        mkdir ISO
        cd ISO

        curl -L -o part1.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
        curl -L -o part1.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
        curl -L -o part1.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      shell: cmd
      run: |
        cd ISO
        7z x part1.7z.001 -oISO_EXTRACTED -y

    # =========================
    # BAIXAR NTLITE
    # =========================
    - name: Download ProjetoNTLite
      shell: powershell
      run: |
        curl -L -o ProjetoNTLite.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip

    - name: Extract ProjetoNTLite
      run: 7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # FIX AUTOMÁTICO XML
    # =========================
    - name: Fix XML (paths + detect)
      shell: powershell
      run: |
        $xml = Get-ChildItem -Recurse -Filter *.xml | Select-Object -First 1

        if (-not $xml) {
          Write-Error "XML não encontrado"
          exit 1
        }

        Write-Host "XML encontrado:" $xml.FullName

        (Get-Content $xml.FullName) `
          -replace 'C:\\ProjetoNTlite\\', '' `
          -replace 'D:\\NTLite\.iso', 'output.iso' |
          Set-Content $xml.FullName

        Write-Host "XML corrigido com sucesso"

    # =========================
    # RODAR NTLITE + LOG REALTIME
    # =========================
    - name: Run NTLite (REALTIME LOG)
      shell: powershell
      run: |
        $exe = "ProjetoNTLite\NTLite\NTLite.exe"
        $xml = Get-ChildItem -Recurse -Filter *.xml | Select-Object -First 1

        if (-not (Test-Path $exe)) {
          Write-Error "NTLite não encontrado"
          exit 1
        }

        Write-Host "Usando preset:" $xml.FullName

        Start-Process $exe `
          -ArgumentList "/silent /load:`"$($xml.FullName)`" /apply /exit" `
          -PassThru | Tee-Object -Variable proc

        # Aguarda processo iniciar de verdade
        Start-Sleep -Seconds 10

        # Loop acompanhando execução
        while (-not $proc.HasExited) {
          Write-Host "NTLite ainda rodando..."
          Start-Sleep -Seconds 20
        }

        Write-Host "NTLite finalizado!"

    # =========================
    # CRIAR ISO
    # =========================
    - name: Create ISO
      shell: cmd
      run: |
        mkdir FINAL
        oscdimg -bISO\ISO_EXTRACTED\boot\etfsboot.com -u2 -h -m -o -lWIN10_CUSTOM ISO\ISO_EXTRACTED FINAL\Win10_CUSTOM.iso

    # =========================
    # SPLIT ISO
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10_CUSTOM.7z FINAL\Win10_CUSTOM.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Win10 Custom Build
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
