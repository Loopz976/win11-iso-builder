name: Build Windows ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        choco install 7zip -y
        choco install oscdimg -y

    # =========================
    # BAIXAR ISO
    # =========================
    - name: Download ISO Parts
      shell: powershell
      run: |
        New-Item -ItemType Directory ISO

        cd ISO

        curl -L -o base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
        curl -L -o base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
        curl -L -o base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

    # =========================
    # EXTRAIR ISO
    # =========================
    - name: Extract ISO
      run: |
        cd ISO
        7z x base.7z.001 -oISO_EXTRACTED -y

    # =========================
    # BAIXAR PROJETO NTLITE
    # =========================
    - name: Download ProjetoNTLite
      run: |
        curl -L -o ProjetoNTLite.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/projetontlite/ProjetoNTlite.zip

    - name: Extract ProjetoNTLite
      run: |
        7z x ProjetoNTLite.zip -oProjetoNTLite -y

    # =========================
    # DEBUG ESTRUTURA
    # =========================
    - name: Debug Files
      run: |
        echo ===== ISO =====
        dir ISO\ISO_EXTRACTED

        echo ===== NTLITE =====
        dir ProjetoNTLite

    # =========================
    # RODAR NTLITE CORRETO
    # =========================
    - name: Run NTLite
      shell: powershell
      run: |
        $ntlite = "$PWD\ProjetoNTLite\NTLite\NTLite.exe"
        $preset = "$PWD\ProjetoNTLite\Preset\W10_19044_FINAL_NVIDIA_21_04_26.xml"
        $source = "$PWD\ISO\ISO_EXTRACTED"
        $log = "$PWD\ntlite.log"

        Write-Host "NTLite Path: $ntlite"
        Write-Host "Preset: $preset"
        Write-Host "Source: $source"

        Start-Process $ntlite `
          -ArgumentList "/silent /source:$source /load:$preset /apply /exit /log:$log" `
          -Wait -NoNewWindow

        Write-Host "==== LOG ===="
        Get-Content $log -Tail 200

    # =========================
    # CRIAR ISO
    # =========================
    - name: Create ISO
      run: |
        mkdir FINAL

        oscdimg -bISO\ISO_EXTRACTED\boot\etfsboot.com `
        -u2 -h -m -o `
        -lWIN10_CUSTOM `
        ISO\ISO_EXTRACTED `
        FINAL\Win10_CUSTOM.iso

    # =========================
    # SPLIT
    # =========================
    - name: Split ISO
      run: |
        7z a -v1900m FINAL\Win10_CUSTOM.7z FINAL\Win10_CUSTOM.iso

    # =========================
    # UPLOAD
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        files: FINAL\*.7z*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
