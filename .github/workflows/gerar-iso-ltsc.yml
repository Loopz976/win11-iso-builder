name: LTSC W10UI AUTO BUILD FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # =========================
      # PREPARAR
      # =========================
      - name: Preparar ambiente
        run: |
          if exist D:\W10UI rmdir /s /q D:\W10UI
          mkdir D:\W10UI
          mkdir D:\W10UI\ISO
          mkdir D:\W10UI\MOUNT
          mkdir D:\W10UI\CAB
          mkdir D:\W10UI\Drivers

      # =========================
      # BAIXAR ISO
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\W10UI\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\W10UI\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\W10UI\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Extrair ISO
        run: |
          7z x D:\W10UI\base.7z.001 -oD:\W10UI -y

      - name: Extrair ISO COMPLETA
        run: |
          for %%i in (D:\W10UI\*.iso) do (
            7z x "%%i" -oD:\W10UI\DVD -y
          )

      # =========================
      # COPIAR INSTALL.WIM (💣 SOLUÇÃO DO TARGET)
      # =========================
      - name: Preparar Target
        run: |
          copy D:\W10UI\DVD\sources\install.wim D:\W10UI\install.wim

      # =========================
      # BAIXAR W10UI
      # =========================
      - name: Baixar W10UI
        run: |
          curl -L -o D:\W10UI\w10ui.zip https://github.com/abbodi1406/W10UI/archive/refs/tags/10.59b.zip
          7z x D:\W10UI\w10ui.zip -oD:\W10UI -y
          xcopy D:\W10UI\W10UI-10.59b\* D:\W10UI\ /E /H /C /I /Y

      # =========================
      # BAIXAR UPDATE
      # =========================
      - name: Baixar update
        run: |
          curl -L -o D:\W10UI\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # BAIXAR DRIVER
      # =========================
      - name: Baixar driver NVIDIA
        run: |
          curl -L -o D:\W10UI\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip
          7z x D:\W10UI\nvidia.zip -oD:\W10UI\Drivers -y

      # =========================
      # CONFIGURAR INI AUTOMÁTICO
      # =========================
      - name: Criar W10UI.ini automático
        run: |
          (
          echo Target=D:\W10UI\install.wim
          echo Repo=D:\W10UI
          echo AutoStart=1
          echo AddDrivers=1
          echo Drv_Source=D:\W10UI\Drivers
          echo Net35=1
          echo Cleanup=1
          echo ResetBase=1
          echo ISO=1
          echo ISODir=D:\W10UI\ISO
          echo MountDir=D:\W10UI\MOUNT
          echo _CabDir=D:\W10UI\CAB
          echo UseWimlib=1
          echo wim2esd=1
          ) > D:\W10UI\W10UI.ini

      # =========================
      # MOVER UPDATE PARA W10UI
      # =========================
      - name: Preparar updates
        run: |
          move D:\W10UI\update.msu D:\W10UI\

      # =========================
      # RODAR W10UI (💣 AGORA FUNCIONA)
      # =========================
      - name: Rodar W10UI
        run: |
          cd /d D:\W10UI
          call W10UI.cmd

      # =========================
      # PEGAR ISO FINAL
      # =========================
      - name: Detectar ISO final
        run: |
          for %%i in (D:\W10UI\ISO\*.iso) do set FINAL=%%i
          echo FINAL=%FINAL%>>%GITHUB_ENV%

      # =========================
      # COMPACTAR
      # =========================
      - name: Compactar
        run: |
          7z a -t7z -mx=9 -v1900m D:\W10UI\FINAL.7z "%FINAL%"

      # =========================
      # UPLOAD
      # =========================
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC FINAL
          files: D:\W10UI\FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
