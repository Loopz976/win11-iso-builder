name: Gerar ISO Windows 10 LTSC FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # =========================
      # PREPARAR
      # =========================
      - name: Preparar ambiente
        run: |
          if exist D:\Files rmdir /s /q D:\Files
          mkdir D:\Files
          mkdir D:\Files\ISO
          mkdir D:\Files\WIM
          mkdir D:\Files\Updates
          mkdir D:\Files\Drivers\OS

      # =========================
      # BAIXAR ISO
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\Files\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\Files\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\Files\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Testar arquivos
        run: |
          7z t D:\Files\base.7z.001

      - name: Extrair ISO
        run: |
          7z x D:\Files\base.7z.001 -oD:\Files\ISO -y

      - name: Mover ISO
        run: |
          for /r D:\Files\ISO %%i in (*.iso) do move "%%i" D:\Files\

      # =========================
      # EXTRAIR INSTALL.WIM
      # =========================
      - name: Extrair install.wim
        run: |
          for %%i in (D:\Files\*.iso) do (
            7z e "%%i" sources\install.wim -oD:\Files\WIM -y
          )

      - name: Validar WIM
        run: |
          if not exist D:\Files\WIM\install.wim exit /b 1

      # =========================
      # UPDATE
      # =========================
      - name: Baixar Update
        run: |
          curl -L -o D:\Files\Updates\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # DRIVER
      # =========================
      - name: Baixar Driver NVIDIA
        run: |
          curl -L -o D:\Files\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip

      - name: Extrair Driver
        run: |
          7z x D:\Files\nvidia.zip -oD:\Files\Drivers\OS -y

      # =========================
      # W10UI
      # =========================
      - name: Extrair W10UI
        run: |
          7z x W10UI_10.59b.zip -oD:\Files -y

      # =========================
      # CONFIG CORRETA
      # =========================
      - name: Criar W10UI.ini
        run: |
          (
          echo [W10UI]
          echo AutoStart=Yes
          echo Silent=Yes
          echo Target=D:\Files\WIM
          echo Updates=D:\Files\Updates
          echo Drivers=D:\Files\Drivers\OS
          echo Cleanup=1
          echo ResetBase=1
          echo Rebuild=1
          echo wim2esd=1
          echo esdcompress=4
          echo ISO=1
          ) > D:\Files\W10UI.ini

      # =========================
      # RODAR W10UI
      # =========================
      - name: Rodar W10UI
        run: |
          cd /d D:\Files
          W10UI.cmd

      # =========================
      # VALIDAR ISO FINAL
      # =========================
      - name: Detectar ISO final
        run: |
          set FINALISO=
          for %%i in (D:\Files\*19044*.iso) do set FINALISO=%%i

          if "%FINALISO%"=="" (
            echo ERRO: ISO nao gerada
            dir D:\Files\
            exit /b 1
          )

          echo FINALISO=%FINALISO% >> %GITHUB_ENV%

      # =========================
      # COMPACTAR
      # =========================
      - name: Compactar ISO
        run: |
          7z a -t7z -mx=9 -v1900m D:\Files\LTSC_FINAL.7z "%FINALISO%"

      # =========================
      # UPLOAD
      # =========================
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC Build ${{ github.run_number }}
          files: D:\Files\LTSC_FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
