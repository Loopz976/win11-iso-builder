name: Gerar ISO Windows 10 LTSC (W10UI Full Auto)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Criar estrutura base
        run: |
          mkdir D:\Files
          mkdir D:\Files\Drivers\OS

      # 📥 ISO BASE
      - name: Baixar ISO base (3 partes)
        run: |
          curl -L -o D:\Files\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
          curl -L -o D:\Files\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
          curl -L -o D:\Files\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

      - name: Extrair ISO base
        run: |
          7z x D:\Files\base.7z.001 -oD:\Files\ISO

      - name: Mover ISO para raiz
        run: |
          move D:\Files\ISO\*.iso D:\Files\

      # 📥 UPDATE
      - name: Baixar KB cumulativo
        run: |
          curl -L -o D:\Files\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # 📥 DRIVER NVIDIA
      - name: Baixar driver NVIDIA
        run: |
          curl -L -o D:\Files\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip
          7z x D:\Files\nvidia.zip -oD:\Files\Drivers\OS

      # 📥 W10UI
      - name: Extrair W10UI
        run: |
          7z x W10UI_10.59b.zip -oD:\Files

      # ⚙️ CONFIG REAL (baseada no comportamento interno do W10UI)
      - name: Criar W10UI.ini otimizado
        run: |
          (
          echo [W10UI]
          echo AutoStart=1
          echo AddUpdates=1
          echo Cleanup=1
          echo ResetBase=1
          echo Drivers=1
          echo Rebuild=1
          echo wim2esd=1
          echo esdcompress=4
          echo ISO=1
          ) > D:\Files\W10UI.ini

      # 🚀 EXECUÇÃO (modo real)
      - name: Executar W10UI
        run: |
          cd /d D:\Files
          call W10UI.cmd

      # 🔍 DETECTAR ISO FINAL (garante pegar a correta)
      - name: Detectar ISO gerada
        shell: cmd
        run: |
          for %%i in (D:\Files\*.iso) do set FINALISO=%%i
          echo FINALISO=%FINALISO% >> %GITHUB_ENV%

      # ❌ FAIL se não gerou
      - name: Validar ISO
        run: |
          if not exist %FINALISO% (
            echo ISO não gerada!
            exit 1
          )

      # 📦 COMPRESSÃO 1900MB
      - name: Compactar ISO (split 1900MB)
        run: |
          7z a -t7z -mx=9 -v1900m D:\Files\LTSC_FINAL.7z %FINALISO%

      # 🚀 UPLOAD FINAL
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC Build ${{ github.run_number }}
          files: D:\Files\LTSC_FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
