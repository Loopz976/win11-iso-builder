name: LTSC AUTO BUILD (FINAL REAL)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
    - uses: actions/checkout@v4

    # =========================
    # PREPARAR
    # =========================
    - name: Preparar ambiente
      run: |
        rmdir /s /q D:\ISO 2>nul
        mkdir D:\ISO
        mkdir D:\ISO\Extract
        mkdir D:\Mount
        mkdir D:\Drivers
        mkdir D:\Final
        mkdir D:\UUP
        mkdir D:\BIN

    # =========================
    # 7ZIP + ARIA2C.EXE
    # =========================
    - name: Instalar dependencias
      run: |
        choco install 7zip -y

        echo Baixando aria2c...
        curl -L -o D:\BIN\aria2.zip https://github.com/aria2/aria2/releases/latest/download/aria2-1.37.0-win-64bit-build1.zip

        7z x D:\BIN\aria2.zip -oD:\BIN\aria2

        copy D:\BIN\aria2\aria2-1.37.0-win-64bit-build1\aria2c.exe D:\BIN\aria2c.exe

    # =========================
    # ISO BASE
    # =========================
    - name: Baixar ISO base
      run: |
        curl -L -o D:\ISO\w10.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
        curl -L -o D:\ISO\w10.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
        curl -L -o D:\ISO\w10.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

    - name: Extrair ISO
      run: |
        7z x D:\ISO\w10.7z.001 -oD:\ISO\Extract

    - name: Preparar WIM
      run: |
        copy D:\ISO\Extract\sources\install.wim D:\install.wim

    # =========================
    # UUP SCRIPT
    # =========================
    - name: Extrair UUP
      run: |
        7z x Updates.zip -oD:\UUP

    - name: Rodar UUP (ARIA2 OK)
      run: |
        cd /d D:\UUP

        set PATH=D:\BIN;%PATH%

        echo Verificando aria2c...
        aria2c -v

        echo Rodando script UUP...
        call uup_download_windows.cmd

    # =========================
    # MONTAR IMAGEM
    # =========================
    - name: Montar imagem
      run: |
        dism /mount-wim /wimfile:D:\install.wim /index:1 /mountdir:D:\Mount

    - name: Reset pending
      run: |
        dism /image:D:\Mount /cleanup-image /revertpendingactions
        dism /image:D:\Mount /cleanup-image /startcomponentcleanup

    # =========================
    # INTEGRAR UPDATES (CAB)
    # =========================
    - name: Integrar updates UUP
      run: |
        for /r D:\UUP %i in (*.cab) do (
          echo Instalando %i
          dism /image:D:\Mount /add-package /packagepath:%i /ignorecheck
        )

    # =========================
    # DRIVER NVIDIA
    # =========================
    - name: Baixar driver
      run: |
        curl -L -o D:\Drivers\driver.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip

    - name: Extrair driver
      run: |
        7z x D:\Drivers\driver.zip -oD:\Drivers\Extract

    - name: Integrar driver
      run: |
        dism /image:D:\Mount /add-driver /driver:D:\Drivers\Extract /recurse

    # =========================
    # CLEAN FINAL
    # =========================
    - name: Cleanup final
      run: |
        dism /image:D:\Mount /cleanup-image /startcomponentcleanup /resetbase

    - name: Commit
      run: |
        dism /unmount-wim /mountdir:D:\Mount /commit

    # =========================
    # ESD MAX
    # =========================
    - name: Converter para ESD (MAX)
      run: |
        dism /export-image /sourceimagefile:D:\install.wim /sourceindex:1 /destinationimagefile:D:\ISO\Extract\sources\install.esd /compress:recovery

    - name: Remover WIM
      run: |
        del D:\ISO\Extract\sources\install.wim

    # =========================
    # ISO FINAL
    # =========================
    - name: Criar ISO
      run: |
        oscdimg -m -o -u2 -udfver102 D:\ISO\Extract D:\Final\LTSC_FINAL.iso

    # =========================
    # UPLOAD RELEASE
    # =========================
    - name: Upload ISO
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        files: D:\Final\LTSC_FINAL.iso
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
