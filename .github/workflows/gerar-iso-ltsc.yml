name: Gerar ISO Windows 10 LTSC (FINAL DEFINITIVO)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # AMBIENTE LIMPO
      # =========================
      - name: Preparar ambiente
        run: |
          if exist D:\Files rmdir /s /q D:\Files
          mkdir D:\Files
          mkdir D:\Files\Updates
          mkdir D:\Files\Drivers\OS

      # =========================
      # BAIXAR ISO (3 PARTES)
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\Files\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\Files\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\Files\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Validar partes
        run: |
          if not exist D:\Files\base.7z.001 exit /b 1
          if not exist D:\Files\base.7z.002 exit /b 1
          if not exist D:\Files\base.7z.003 exit /b 1

      - name: Testar integridade 7z
        run: |
          7z t D:\Files\base.7z.001

      - name: Extrair pacote base
        run: |
          7z x D:\Files\base.7z.001 -oD:\Files\ISO -y

      # =========================
      # MOVER ISO
      # =========================
      - name: Mover ISO
        run: |
          for /r D:\Files\ISO %%i in (*.iso) do (
              move "%%i" D:\Files\
          )

      - name: Validar ISO base
        run: |
          dir D:\Files\*.iso || exit /b 1

      # =========================
      # EXTRAIR ISO → DVD
      # =========================
      - name: Extrair ISO para DVD
        run: |
          mkdir D:\Files\DVD
          for %%i in (D:\Files\*.iso) do (
              7z x "%%i" -oD:\Files\DVD -y
          )

      - name: Validar estrutura DVD
        run: |
          if not exist D:\Files\DVD\sources\install.wim (
            if not exist D:\Files\DVD\sources\install.esd exit /b 1
          )

      # =========================
      # UPDATE
      # =========================
      - name: Baixar Update
        run: |
          curl -L -o D:\Files\Updates\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # DRIVER NVIDIA
      # =========================
      - name: Baixar Driver
        run: |
          curl -L -o D:\Files\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip

      - name: Extrair Driver
        run: |
          7z x D:\Files\nvidia.zip -oD:\Files\Drivers\OS -y

      # =========================
      # W10UI
      # =========================
      - name: Extrair W10UI
        run: |
          7z x W10UI_10.59b.zip -oD:\Files -y

      # =========================
      # CONFIG
      # =========================
      - name: Criar W10UI.ini
        run: |
          (
          echo [W10UI]
          echo AutoStart=1
          echo Silent=1
          echo Repo=D:\Files\Updates
          echo AddUpdates=1
          echo Cleanup=1
          echo ResetBase=1
          echo Rebuild=1
          echo AddDrivers=1
          echo wim2esd=1
          echo esdcompress=4
          echo ISO=1
          ) > D:\Files\W10UI.ini

      # =========================
      # EXECUTAR W10UI (TARGET CORRETO)
      # =========================
      - name: Rodar W10UI
        run: |
          cd /d D:\Files

          (
            echo 1
            echo D:\Files\DVD
            echo 0
          ) | W10UI.cmd

      # =========================
      # VALIDAR ISO FINAL
      # =========================
      - name: Detectar ISO final
        run: |
          set FINALISO=

          for %%i in (D:\Files\*19044*.iso) do (
              set FINALISO=%%i
          )

          if "%FINALISO%"=="" (
              echo ERRO: ISO final nao encontrada
              dir D:\Files\
              exit /b 1
          )

          echo ISO FINAL: %FINALISO%
          echo FINALISO=%FINALISO% >> %GITHUB_ENV%

      # =========================
      # COMPRESSÃO FINAL
      # =========================
      - name: Compactar ISO
        run: |
          7z a -t7z -mx=9 -v1900m D:\Files\LTSC_FINAL.7z "%FINALISO%"

      # =========================
      # UPLOAD RELEASE
      # =========================
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC Build ${{ github.run_number }}
          files: D:\Files\LTSC_FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
