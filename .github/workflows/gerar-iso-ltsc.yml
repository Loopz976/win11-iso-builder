name: Gerar ISO Windows 10 LTSC (W10UI + CACHE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar estrutura
        run: |
          mkdir D:\Files
          mkdir D:\Files\Drivers\OS

      # 🧠 CACHE ISO BASE
      - name: Cache ISO Base
        id: cache-iso
        uses: actions/cache@v4
        with:
          path: D:\Files\base.7z.*
          key: iso-base-v1

      - name: Baixar ISO (se não estiver em cache)
        if: steps.cache-iso.outputs.cache-hit != 'true'
        run: |
          curl -L -o D:\Files\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001
          curl -L -o D:\Files\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002
          curl -L -o D:\Files\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003

      - name: Extrair ISO
        run: 7z x D:\Files\base.7z.001 -oD:\Files\ISO

      - name: Mover ISO
        run: move D:\Files\ISO\*.iso D:\Files\

      # 🧠 CACHE DRIVER
      - name: Cache Driver NVIDIA
        id: cache-driver
        uses: actions/cache@v4
        with:
          path: D:\Files\nvidia.zip
          key: nvidia-driver-v1

      - name: Baixar Driver (se necessário)
        if: steps.cache-driver.outputs.cache-hit != 'true'
        run: |
          curl -L -o D:\Files\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip

      - name: Extrair Driver
        run: 7z x D:\Files\nvidia.zip -oD:\Files\Drivers\OS

      # 📥 UPDATE (SEM CACHE — MUDA SEMPRE)
      - name: Baixar Update
        run: |
          curl -L -o D:\Files\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # 🧠 CACHE W10UI
      - name: Cache W10UI
        id: cache-w10ui
        uses: actions/cache@v4
        with:
          path: D:\Files\W10UI.cmd
          key: w10ui-v1

      - name: Extrair W10UI (se necessário)
        if: steps.cache-w10ui.outputs.cache-hit != 'true'
        run: 7z x W10UI_10.59b.zip -oD:\Files

      # ⚙️ CONFIG
      - name: Configurar W10UI
        run: |
          (
          echo [W10UI]
          echo AutoStart=1
          echo AddUpdates=1
          echo Cleanup=1
          echo ResetBase=1
          echo Drivers=1
          echo Rebuild=1
          echo wim2esd=1
          echo esdcompress=4
          echo ISO=1
          ) > D:\Files\W10UI.ini

      # 🚀 EXECUÇÃO
      - name: Rodar W10UI
        run: |
          cd /d D:\Files
          call W10UI.cmd

      # 🔍 ISO FINAL
      - name: Detectar ISO
        shell: cmd
        run: |
          for %%i in (D:\Files\*.iso) do set FINALISO=%%i
          echo FINALISO=%FINALISO% >> %GITHUB_ENV%

      - name: Validar ISO
        run: |
          if not exist %FINALISO% exit 1

      # 📦 SPLIT
      - name: Compactar 1900MB
        run: |
          7z a -t7z -mx=9 -v1900m D:\Files\LTSC_FINAL.7z %FINALISO%

      # 🚀 RELEASE
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC Build ${{ github.run_number }}
          files: D:\Files\LTSC_FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
