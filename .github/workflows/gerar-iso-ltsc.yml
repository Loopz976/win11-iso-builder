name: LTSC AUTO BUILD FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # =========================
      # PREPARAR
      # =========================
      - name: Preparar ambiente
        run: |
          mkdir D:\ISO
          mkdir D:\MOUNT
          mkdir D:\UPDATES
          mkdir D:\DRIVERS

      # =========================
      # BAIXAR ISO BASE
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\ISO\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\ISO\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\ISO\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Extrair ISO
        run: |
          7z x D:\ISO\base.7z.001 -oD:\ISO -y

      - name: Extrair estrutura ISO
        run: |
          for %%i in (D:\ISO\*.iso) do (
            7z x "%%i" -oD:\ISO\DVD -y
          )

      # =========================
      # UPDATE
      # =========================
      - name: Baixar update
        run: |
          curl -L -o D:\UPDATES\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # DRIVER
      # =========================
      - name: Baixar driver NVIDIA
        run: |
          curl -L -o D:\DRIVERS\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip
          7z x D:\DRIVERS\nvidia.zip -oD:\DRIVERS -y

      # =========================
      # MONTAR WIM
      # =========================
      - name: Montar imagem
        run: |
          dism /Mount-Wim /WimFile:D:\ISO\DVD\sources\install.wim /index:1 /MountDir:D:\MOUNT

      # =========================
      # INTEGRAR UPDATE
      # =========================
      - name: Integrar update
        run: |
          dism /Image:D:\MOUNT /Add-Package /PackagePath:D:\UPDATES

      # =========================
      # INTEGRAR DRIVER
      # =========================
      - name: Integrar drivers
        run: |
          dism /Image:D:\MOUNT /Add-Driver /Driver:D:\DRIVERS /Recurse

      # =========================
      # .NET 3.5
      # =========================
      - name: Ativar NetFx3
        run: |
          dism /Image:D:\MOUNT /Enable-Feature /FeatureName:NetFx3 /All /Source:D:\ISO\DVD\sources\sxs

      # =========================
      # CLEANUP MÁXIMO
      # =========================
      - name: Cleanup
        run: |
          dism /Image:D:\MOUNT /Cleanup-Image /StartComponentCleanup /ResetBase

      # =========================
      # COMMIT
      # =========================
      - name: Commit
        run: |
          dism /Unmount-Wim /MountDir:D:\MOUNT /Commit

      # =========================
      # CONVERTER PARA ESD (MÁXIMO)
      # =========================
      - name: Converter para ESD
        run: |
          dism /Export-Image ^
          /SourceImageFile:D:\ISO\DVD\sources\install.wim ^
          /DestinationImageFile:D:\ISO\DVD\sources\install.esd ^
          /Compress:recovery

      - name: Remover WIM
        run: |
          del D:\ISO\DVD\sources\install.wim

      # =========================
      # GERAR ISO
      # =========================
      - name: Criar ISO
        run: |
          oscdimg -bD:\ISO\DVD\boot\etfsboot.com -u2 -h -m -o D:\ISO\DVD D:\FINAL.iso

      # =========================
      # UPLOAD
      # =========================
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LTSC FINAL
          files: D:\FINAL.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
