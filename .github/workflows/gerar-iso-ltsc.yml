name: LTSC AUTO BUILD DISM FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # =========================
      # PREPARAR
      # =========================
      - name: Preparar ambiente
        run: |
          if exist D:\Files rmdir /s /q D:\Files
          mkdir D:\Files
          mkdir D:\Files\ISO
          mkdir D:\Files\DVD
          mkdir D:\Files\MOUNT
          mkdir D:\Files\Updates
          mkdir D:\Files\Drivers

      # =========================
      # BAIXAR ISO
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\Files\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\Files\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\Files\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Extrair ISO
        run: |
          7z x D:\Files\base.7z.001 -oD:\Files\ISO -y

      - name: Mover ISO
        run: |
          for /r D:\Files\ISO %%i in (*.iso) do move "%%i" D:\Files\

      # =========================
      # EXTRAIR ISO COMPLETA
      # =========================
      - name: Extrair ISO COMPLETA
        run: |
          for %%i in (D:\Files\*.iso) do (
            7z x "%%i" -oD:\Files\DVD -y
          )

      # =========================
      # BAIXAR UPDATE
      # =========================
      - name: Baixar update
        run: |
          curl -L -o D:\Files\Updates\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # BAIXAR DRIVER
      # =========================
      - name: Baixar driver NVIDIA
        run: |
          curl -L -o D:\Files\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip

      - name: Extrair driver
        run: |
          7z x D:\Files\nvidia.zip -oD:\Files\Drivers -y

      # =========================
      # MONTAR IMAGEM
      # =========================
      - name: Montar imagem
        run: |
          dism /Mount-Wim /WimFile:D:\Files\DVD\sources\install.wim /index:1 /MountDir:D:\Files\MOUNT

      # =========================
      # FIX SERVICING (CRÍTICO)
      # =========================
      - name: Preparar imagem (fix servicing)
        run: |
          dism /Image:D:\Files\MOUNT /Cleanup-Image /StartComponentCleanup

      # =========================
      # INTEGRAR UPDATE (CORRIGIDO)
      # =========================
      - name: Integrar update
        run: |
          dism /Image:D:\Files\MOUNT /Add-Package /PackagePath:D:\Files\Updates\update.msu /IgnoreCheck

      # =========================
      # INTEGRAR DRIVERS
      # =========================
      - name: Integrar drivers
        run: |
          dism /Image:D:\Files\MOUNT /Add-Driver /Driver:D:\Files\Drivers /Recurse

      # =========================
      # ATIVAR NETFX 3.5
      # =========================
      - name: Ativar .NET 3.5
        run: |
          dism /Image:D:\Files\MOUNT /Enable-Feature /FeatureName:NetFx3 /All /Source:D:\Files\DVD\sources\sxs /LimitAccess

      # =========================
      # CLEANUP FINAL PESADO
      # =========================
      - name: Cleanup final
        run: |
          dism /Image:D:\Files\MOUNT /Cleanup-Image /StartComponentCleanup /ResetBase

      # =========================
      # COMMIT
      # =========================
      - name: Commit imagem
        run: |
          dism /Unmount-Wim /MountDir:D:\Files\MOUNT /Commit

      # =========================
      # CONVERTER PARA ESD (MAX)
      # =========================
      - name: Converter para ESD
        run: |
          dism /Export-Image /SourceImageFile:D:\Files\DVD\sources\install.wim /SourceIndex:1 /DestinationImageFile:D:\Files\DVD\sources\install.esd /Compress:recovery

      - name: Remover WIM
        run: |
          del D:\Files\DVD\sources\install.wim

      # =========================
      # CRIAR ISO
      # =========================
      - name: Criar ISO
        run: |
          oscdimg -m -o -u2 -udfver102 D:\Files\DVD D:\Files\LTSC_FINAL.iso

      # =========================
      # COMPACTAR
      # =========================
      - name: Compactar ISO
        run: |
          7z a -t7z -mx=9 -v1900m D:\Files\LTSC_FINAL.7z D:\Files\LTSC_FINAL.iso

      # =========================
      # UPLOAD
      # =========================
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC Build ${{ github.run_number }}
          files: D:\Files\LTSC_FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
