name: gerar-iso-ltsc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Criar estrutura
      run: |
        mkdir C:\Files
        mkdir C:\Files\Drivers\OS

    # =========================
    # ISO BASE (SUA)
    # =========================
    - name: Baixar ISO partes
      run: |
        curl -L -o iso.7z.001 "https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.001"
        curl -L -o iso.7z.002 "https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.002"
        curl -L -o iso.7z.003 "https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc21h2-base-2/Win10LTSC21H2Base.7z.003"

    - name: Extrair ISO
      run: |
        7z x iso.7z.001 -oC:\Files

    # Renomear pra garantir detecção
    - name: Padronizar nome ISO
      run: |
        for %%f in (C:\Files\*.iso) do ren "%%f" "install.iso"

    # =========================
    # UPDATE KB
    # =========================
    - name: Baixar KB
      run: |
        curl -L -o C:\Files\update.msu "https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu"

    # =========================
    # DRIVER NVIDIA
    # =========================
    - name: Baixar driver
      run: |
        curl -L -o driver.zip "https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip"
        7z x driver.zip -oC:\Files\Drivers\OS

    # mover só Display.Driver
    - name: Ajustar estrutura driver
      run: |
        for /d %%d in (C:\Files\Drivers\OS\*) do (
          if /I not "%%~nxd"=="Display.Driver" (
            rmdir /s /q "%%d"
          )
        )

    # =========================
    # W10UI
    # =========================
    - name: Extrair W10UI
      run: |
        7z x W10UI_10.59b.zip -oC:\Files

    # =========================
    # EXECUÇÃO
    # =========================
    - name: Rodar W10UI automático
      run: |
        cd C:\Files
        cmd /c W10UI.cmd

    # =========================
    # SPLIT FINAL
    # =========================
    - name: Split ISO 1900MB
      run: |
        mkdir output
        for %%f in (C:\Files\*.iso) do (
          7z a -v1900m output\final.7z %%f
        )

    # =========================
    # UPLOAD
    # =========================
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: iso-ltsc-final
        name: ISO LTSC FINAL
        files: output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
