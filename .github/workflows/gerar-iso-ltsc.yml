name: Gerar ISO Windows 10 LTSC (W10UI FINAL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar estrutura limpa
        run: |
          if exist D:\Files rmdir /s /q D:\Files
          mkdir D:\Files
          mkdir D:\Files\Drivers\OS

      # =========================
      # DOWNLOAD ISO (MULTIPART)
      # =========================
      - name: Baixar ISO (3 partes)
        run: |
          curl -L -o D:\Files\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\Files\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\Files\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Validar partes
        run: |
          if not exist D:\Files\base.7z.001 exit /b 1
          if not exist D:\Files\base.7z.002 exit /b 1
          if not exist D:\Files\base.7z.003 exit /b 1

      - name: Testar integridade
        run: |
          7z t D:\Files\base.7z.001

      - name: Extrair pacote
        run: |
          7z x D:\Files\base.7z.001 -oD:\Files\ISO -y

      # =========================
      # LOCALIZAR ISO REAL
      # =========================
      - name: Encontrar ISO original
        run: |
          set FOUND=0

          for /r D:\Files\ISO %%i in (*.iso) do (
              echo ISO encontrada: %%i
              move "%%i" D:\Files\
              set FOUND=1
          )

          if %FOUND%==0 (
              echo ERRO: ISO nao encontrada dentro do pacote
              exit /b 1
          )

      - name: Validar ISO
        run: |
          dir D:\Files\*.iso || exit /b 1

      # =========================
      # UPDATE
      # =========================
      - name: Baixar Update
        run: |
          curl -L -o D:\Files\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # DRIVER NVIDIA
      # =========================
      - name: Baixar Driver
        run: |
          curl -L -o D:\Files\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip

      - name: Extrair Driver
        run: |
          7z x D:\Files\nvidia.zip -oD:\Files\Drivers\OS -y

      # =========================
      # W10UI
      # =========================
      - name: Extrair W10UI
        run: |
          7z x W10UI_10.59b.zip -oD:\Files -y

      # =========================
      # CONFIG
      # =========================
      - name: Criar W10UI.ini
        run: |
          (
          echo [W10UI]
          echo AutoStart=1
          echo AddUpdates=1
          echo Cleanup=1
          echo ResetBase=1
          echo Drivers=1
          echo Rebuild=1
          echo wim2esd=1
          echo esdcompress=4
          echo ISO=1
          ) > D:\Files\W10UI.ini

      # =========================
      # EXECUÇÃO
      # =========================
      - name: Rodar W10UI
        run: |
          cd /d D:\Files
          call W10UI.cmd

      # =========================
      # ISO FINAL
      # =========================
      - name: Detectar ISO final
        run: |
          for %%i in (D:\Files\*.iso) do set FINALISO=%%i
          echo FINALISO=%FINALISO% >> %GITHUB_ENV%

      - name: Validar ISO final
        run: |
          if not exist %FINALISO% exit /b 1

      # =========================
      # COMPRESSÃO
      # =========================
      - name: Compactar ISO
        run: |
          7z a -t7z -mx=9 -v1900m D:\Files\LTSC_FINAL.7z %FINALISO%

      # =========================
      # RELEASE
      # =========================
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC Build ${{ github.run_number }}
          files: D:\Files\LTSC_FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
