name: LTSC W10UI FULL AUTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # =========================
      # PREPARAR
      # =========================
      - name: Preparar ambiente
        run: |
          if exist D:\W10UI rmdir /s /q D:\W10UI
          mkdir D:\W10UI
          mkdir D:\W10UI\ISO
          mkdir D:\W10UI\MOUNT
          mkdir D:\W10UI\CAB
          mkdir D:\W10UI\Drivers
          mkdir D:\W10UI\Updates

      # =========================
      # W10UI
      # =========================
      - name: Extrair W10UI
        run: |
          copy "%CD%\W10UI_10.59b.zip" D:\W10UI\w10ui.zip
          7z x D:\W10UI\w10ui.zip -oD:\W10UI -y

      # =========================
      # ISO
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\W10UI\base.iso "LINK_ISO"

      - name: Extrair ISO
        run: |
          7z x D:\W10UI\base.iso -oD:\W10UI\DVD -y

      - name: Preparar WIM
        run: |
          copy D:\W10UI\DVD\sources\install.wim D:\W10UI\install.wim

      # =========================
      # UPDATE
      # =========================
      - name: Update
        run: |
          curl -L -o D:\W10UI\Updates\update.msu "LINK_MSU"

      # =========================
      # DRIVER
      # =========================
      - name: Drivers
        run: |
          curl -L -o D:\W10UI\drv.zip "LINK_DRIVER"
          7z x D:\W10UI\drv.zip -oD:\W10UI\Drivers -y

      # =========================
      # EXECUÇÃO FULL (SEM INI EXTERNO)
      # =========================
      - name: Rodar W10UI FULL
        run: |
          cd /d D:\W10UI

          echo ==== FORCE CONFIG ====

          set "_target=D:\W10UI\install.wim"
          set "_repo=D:\W10UI"
          set "_drv=D:\W10UI\Drivers"

          set "AddUpdates=1"
          set "AddDrivers=1"
          set "Cleanup=1"
          set "ResetBase=1"
          set "Rebuild=1"
          set "Net35=1"

          set "wim2esd=1"
          set "ESDCompress=LZMS"

          set "ISO=1"
          set "ISODir=D:\W10UI\ISO"
          set "MountDir=D:\W10UI\MOUNT"
          set "_CabDir=D:\W10UI\CAB"

          set "_work=1"
          set "_act=1"
          set "AutoStart=1"

          call W10UI.cmd

      # =========================
      # DETECTAR ISO
      # =========================
      - name: Detectar ISO
        run: |
          for %%i in (D:\W10UI\ISO\*.iso) do set FINAL=%%i
          echo FINAL=%FINAL%>>%GITHUB_ENV%

      # =========================
      # UPLOAD
      # =========================
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.FINAL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
