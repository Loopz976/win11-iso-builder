name: LTSC W10UI FINAL AUTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # =========================
      # PREPARAR AMBIENTE
      # =========================
      - name: Preparar ambiente
        run: |
          if exist D:\W10UI rmdir /s /q D:\W10UI
          mkdir D:\W10UI
          mkdir D:\W10UI\ISO
          mkdir D:\W10UI\MOUNT
          mkdir D:\W10UI\CAB
          mkdir D:\W10UI\Drivers
          mkdir D:\W10UI\Updates

      # =========================
      # EXTRAIR W10UI
      # =========================
      - name: Extrair W10UI
        run: |
          copy "%CD%\W10UI_10.59b.zip" D:\W10UI\w10ui.zip
          7z x D:\W10UI\w10ui.zip -oD:\W10UI -y

      # =========================
      # BAIXAR ISO BASE
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\W10UI\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\W10UI\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\W10UI\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Extrair ISO
        run: |
          7z x D:\W10UI\base.7z.001 -oD:\W10UI -y

      - name: Extrair estrutura ISO
        run: |
          for %%i in (D:\W10UI\*.iso) do (
            7z x "%%i" -oD:\W10UI\DVD -y
          )

      # =========================
      # PREPARAR INSTALL.WIM
      # =========================
      - name: Preparar install.wim
        run: |
          copy D:\W10UI\DVD\sources\install.wim D:\W10UI\install.wim

      # =========================
      # BAIXAR UPDATE
      # =========================
      - name: Baixar update
        run: |
          curl -L -o D:\W10UI\Updates\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # BAIXAR DRIVER NVIDIA
      # =========================
      - name: Baixar driver NVIDIA
        run: |
          curl -L -o D:\W10UI\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip
          7z x D:\W10UI\nvidia.zip -oD:\W10UI\Drivers -y

      # =========================
      # CRIAR INI (AGORA CORRETO)
      # =========================
      - name: Criar W10UI.ini
        run: |
          (
          echo [W10UI]
          echo Target=D:\W10UI\install.wim
          echo Repo=D:\W10UI\Updates
          echo AutoStart=1
          echo Silent=1
          echo AddUpdates=1
          echo AddDrivers=1
          echo Drv_Source=D:\W10UI\Drivers
          echo Net35=1
          echo Cleanup=1
          echo ResetBase=1
          echo Rebuild=1
          echo ISO=1
          echo ISODir=D:\W10UI\ISO
          echo MountDir=D:\W10UI\MOUNT
          echo _CabDir=D:\W10UI\CAB
          echo wim2esd=1
          ) > D:\W10UI\W10UI.ini

      # =========================
      # EXECUTAR W10UI (FORÇADO)
      # =========================
      - name: Executar W10UI automático
        run: |
          cd /d D:\W10UI

          (
            echo 0
            echo 0
          ) | call W10UI.cmd

      # =========================
      # DETECTAR ISO FINAL
      # =========================
      - name: Detectar ISO final
        run: |
          for %%i in (D:\W10UI\ISO\*.iso) do set FINAL=%%i
          echo FINAL=%FINAL%>>%GITHUB_ENV%

      # =========================
      # COMPACTAR ISO
      # =========================
      - name: Compactar ISO
        run: |
          7z a -t7z -mx=9 -v1900m D:\W10UI\FINAL.7z "%FINAL%"

      # =========================
      # UPLOAD RELEASE
      # =========================
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ltsc-${{ github.run_number }}
          name: LTSC FINAL
          files: D:\W10UI\FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
