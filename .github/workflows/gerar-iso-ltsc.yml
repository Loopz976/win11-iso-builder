name: LTSC BUILD FULL AUTO (DISM)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # =========================
      # PREPARAR
      # =========================
      - name: Preparar ambiente
        run: |
          if exist D:\ISO rmdir /s /q D:\ISO
          mkdir D:\ISO
          mkdir D:\ISO\DVD
          mkdir D:\ISO\MOUNT
          mkdir D:\ISO\Drivers
          mkdir D:\ISO\Updates

      # =========================
      # BAIXAR ISO BASE
      # =========================
      - name: Baixar ISO
        run: |
          curl -L -o D:\ISO\base.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
          curl -L -o D:\ISO\base.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
          curl -L -o D:\ISO\base.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

      - name: Extrair ISO
        run: |
          7z x D:\ISO\base.7z.001 -oD:\ISO -y

      - name: Extrair estrutura ISO
        run: |
          for %%i in (D:\ISO\*.iso) do (
            7z x "%%i" -oD:\ISO\DVD -y
          )

      # =========================
      # PREPARAR WIM
      # =========================
      - name: Copiar install.wim
        run: |
          copy D:\ISO\DVD\sources\install.wim D:\ISO\install.wim

      # =========================
      # BAIXAR UPDATE
      # =========================
      - name: Baixar update
        run: |
          curl -L -o D:\ISO\Updates\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

      # =========================
      # BAIXAR DRIVER
      # =========================
      - name: Baixar driver NVIDIA
        run: |
          curl -L -o D:\ISO\nvidia.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip
          7z x D:\ISO\nvidia.zip -oD:\ISO\Drivers -y

      # =========================
      # MONTAR IMAGEM
      # =========================
      - name: Mount WIM
        run: |
          dism /Mount-Wim /WimFile:D:\ISO\install.wim /index:1 /MountDir:D:\ISO\MOUNT

      # =========================
      # INTEGRAR UPDATE
      # =========================
      - name: Integrar update
        run: |
          dism /Image:D:\ISO\MOUNT /Add-Package /PackagePath:D:\ISO\Updates

      # =========================
      # INTEGRAR DRIVERS
      # =========================
      - name: Integrar drivers
        run: |
          dism /Image:D:\ISO\MOUNT /Add-Driver /Driver:D:\ISO\Drivers /Recurse

      # =========================
      # LIMPEZA PROFUNDA
      # =========================
      - name: Cleanup
        run: |
          dism /Image:D:\ISO\MOUNT /Cleanup-Image /StartComponentCleanup /ResetBase

      # =========================
      # COMMIT
      # =========================
      - name: Commit
        run: |
          dism /Unmount-Wim /MountDir:D:\ISO\MOUNT /Commit

      # =========================
      # BAIXAR WIMLIB
      # =========================
      - name: Baixar wimlib
        run: |
          curl -L -o D:\wimlib.zip https://wimlib.net/downloads/wimlib-1.14.4-windows-x86_64-bin.zip
          7z x D:\wimlib.zip -oD:\wimlib -y

      # =========================
      # CONVERTER PRA ESD MAXIMO
      # =========================
      - name: Converter ESD (MAX)
        run: |
          D:\wimlib\wimlib-imagex.exe export D:\ISO\install.wim all D:\ISO\DVD\sources\install.esd --compress=LZMS --solid
          del D:\ISO\DVD\sources\install.wim

      # =========================
      # BAIXAR OSCDIMG
      # =========================
      - name: Baixar oscdimg
        run: |
          curl -L -o D:\oscdimg.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/tools/oscdimg.zip
          7z x D:\oscdimg.zip -oD:\oscdimg -y

      # =========================
      # CRIAR ISO FINAL
      # =========================
      - name: Criar ISO
        run: |
          D:\oscdimg\oscdimg.exe -m -o -u2 -udfver102 ^
          -bootdata:2#p0,e,bD:\ISO\DVD\boot\etfsboot.com#pEF,e,bD:\ISO\DVD\efi\microsoft\boot\efisys.bin ^
          D:\ISO\DVD D:\ISO\LTSC_FINAL.iso

      # =========================
      # COMPACTAR
      # =========================
      - name: Compactar
        run: |
          7z a -t7z -mx=9 -v1900m D:\ISO\FINAL.7z D:\ISO\LTSC_FINAL.iso

      # =========================
      # UPLOAD RELEASE
      # =========================
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LTSC FINAL
          files: D:\ISO\FINAL.7z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
