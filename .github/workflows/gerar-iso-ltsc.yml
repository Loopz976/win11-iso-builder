name: LTSC AUTO BUILD FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
    - uses: actions/checkout@v4

    - name: Preparar ambiente
      run: |
        if exist D:\ISO rmdir /s /q D:\ISO
        mkdir D:\ISO
        mkdir D:\ISO\Extract
        mkdir D:\Mount
        mkdir D:\Updates
        mkdir D:\Drivers
        mkdir D:\Final

    - name: Baixar ISO partes
      run: |
        curl -L -o D:\ISO\w10.7z.001 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.001
        curl -L -o D:\ISO\w10.7z.002 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.002
        curl -L -o D:\ISO\w10.7z.003 https://github.com/Loopz976/ltsc-auto-builder/releases/download/w10-ltsc-2021-24459629943/W10LTSC2021.7z.003

    - name: Extrair ISO
      run: |
        7z x D:\ISO\w10.7z.001 -oD:\ISO\Extract

    - name: Preparar install.wim
      run: |
        copy D:\ISO\Extract\sources\install.wim D:\install.wim

    - name: Baixar update
      run: |
        curl -L -o D:\Updates\update.msu https://catalog.s.download.windowsupdate.com/d/msdownload/update/software/secu/2026/04/windows10.0-kb5082200-x64_3c40f2448161c62e043ee564f4ab9688117c06a6.msu

    - name: Baixar driver NVIDIA
      run: |
        curl -L -o D:\Drivers\driver.zip https://github.com/Loopz976/ltsc-auto-builder/releases/download/nvidia-driver-5/Display.Driver.zip

    - name: Extrair driver
      run: |
        7z x D:\Drivers\driver.zip -oD:\Drivers\Extract

    - name: Montar imagem
      run: |
        dism /mount-wim /wimfile:D:\install.wim /index:1 /mountdir:D:\Mount

    - name: Limpar pendencias
      run: |
        dism /image:D:\Mount /cleanup-image /revertpendingactions

    - name: Extrair MSU
      run: |
        mkdir D:\Updates\Extract
        expand -F:* D:\Updates\update.msu D:\Updates\Extract

    - name: Integrar update
      run: |
        for %i in (D:\Updates\Extract\*.cab) do dism /image:D:\Mount /add-package /packagepath:%i

    - name: Integrar drivers
      run: |
        dism /image:D:\Mount /add-driver /driver:D:\Drivers\Extract /recurse

    - name: Cleanup total
      run: |
        dism /image:D:\Mount /cleanup-image /startcomponentcleanup /resetbase

    - name: Commit imagem
      run: |
        dism /unmount-wim /mountdir:D:\Mount /commit

    - name: Converter para ESD
      run: |
        dism /export-image /sourceimagefile:D:\install.wim /sourceindex:1 /destinationimagefile:D:\ISO\Extract\sources\install.esd /compress:recovery /checkintegrity

    - name: Remover WIM
      run: |
        del D:\ISO\Extract\sources\install.wim

    - name: Criar ISO
      run: |
        oscdimg -m -o -u2 -udfver102 D:\ISO\Extract D:\Final\LTSC_FINAL.iso

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        files: D:\Final\LTSC_FINAL.iso
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
